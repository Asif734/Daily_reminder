[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.11"
strict = true
exclude = "venv|alembic"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["services"]
asyncio_mode = "auto"

