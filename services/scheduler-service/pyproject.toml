[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reminder-scheduler-service"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["reminder-common", "celery[redis]>=5.4,<6", "httpx>=0.28,<1"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "ruff>=0.8,<1", "mypy>=1.13,<2"]

[tool.hatch.build.targets.wheel]
packages = ["app"]
