[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reminder-api-gateway"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["reminder-common", "uvicorn[standard]>=0.32,<1", "httpx>=0.28,<1"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "ruff>=0.8,<1", "mypy>=1.13,<2"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

